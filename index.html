.palpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.pal{display:flex;flex-direction:column;gap:8px;padding:8px 8px 10px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .15s}
.pal:hover{transform:translateY(-1px)}
.pal[aria-pressed="true"]{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade) inset}
.pal .pv{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.08);height:62px}
.pal .pm{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:7px}
.pal .pm b{display:block;height:16px;border-radius:5px}.pal .pm b span{display:block;height:100%;width:62%;border-radius:999px}
.pal .pm i{display:flex;gap:4px}.pal .pm i u{display:block;height:6px;flex:1;border-radius:3px;opacity:.9}
.pal .pn{font-size:14px;font-weight:600;padding-left:2px}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--jade);outline-offset:2px}
.zh{font-family:var(--zh)}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;font-weight:650}
h3{font-size:17px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- Khung ---------- */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;padding:28px 14px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin:0 8px 26px;font-weight:700;font-size:15px}
.brand .hzgrid{--cs:30px}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;border-radius:8px;background:none;color:var(--muted);text-align:left;cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav .glyph{font-family:var(--kai);font-size:21px;width:24px;text-align:center;line-height:1}
.nav .sync{margin-top:auto;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--jade)}.dot.err{background:var(--seal)}
main{width:100%;max-width:860px;padding:44px 52px 72px}
body.in-session .nav{display:none}
body.in-session .app{grid-template-columns:1fr}
body.in-session main{max-width:720px;margin:0 auto;padding-top:28px}

/* ---------- Ô chữ mễ (米字格) ---------- */
.hzgrid{display:inline-flex;--cs:124px}
.hzgrid{--cs2:min(var(--cs), calc((100vw - 104px) / var(--n, 1)))}
.cell{position:relative;width:var(--cs2);height:var(--cs2);border:1.5px solid var(--seal);display:grid;place-items:center;background:var(--surface);flex:none}
.cell+.cell{border-left:0}
.cell svg{position:absolute;inset:0;width:100%;height:100%}
.cell path{stroke:var(--grid);stroke-width:1;fill:none;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.cell .ch{position:relative;font-family:var(--kai);font-size:calc(var(--cs2) * .74);line-height:1;color:var(--ink)}
.hzgrid.md{--cs:84px}.hzgrid.sm{--cs:48px}.hzgrid.xs{--cs:34px}
.seal{display:inline-block;border:1.5px solid var(--seal);color:var(--seal);padding:1px 8px;border-radius:3px;font-size:13px;font-weight:700;letter-spacing:.03em;transform:rotate(-2deg);white-space:nowrap}
.stamp{animation:stamp .38s cubic-bezier(.2,.9,.3,1.3)}
@keyframes stamp{0%{transform:scale(1.9) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}

/* ---------- Nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;min-height:46px}
.btn:hover{opacity:.9}
.btn .kbd{color:inherit;border-color:currentColor;opacity:.6}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.big{font-size:18px;padding:16px 30px;min-height:58px}
.btn[disabled]{opacity:.45;cursor:default}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.say{border:1.5px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.say:hover{border-color:var(--jade);color:var(--jade)}
.say svg{width:16px;height:16px}
.kbd{display:none;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:20px;font-family:var(--font)}
@media (hover:hover) and (pointer:fine){.kbd{display:inline-block}}

/* ---------- Trang chủ ---------- */
.today-head{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.today-head .date{margin-top:4px}
.summary{font-size:20px;line-height:1.5;max-width:30em;margin-bottom:24px}
.summary b{font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:36px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.fact .n{font-size:26px;font-weight:700;line-height:1.1}
.fact .l{font-size:14px;color:var(--muted)}
.notice{margin-top:28px;padding:14px 16px;border-left:3px solid var(--seal);background:var(--surface);border-radius:0 8px 8px 0;font-size:15px}
details.how{margin-top:28px;background:var(--surface);border-radius:12px;padding:4px 20px;border:1px solid var(--line)}
details.how summary{cursor:pointer;padding:14px 0;font-weight:600}
details.how ul{margin:0 0 16px;padding-left:20px}
details.how li{margin:8px 0}

/* ---------- Phiên học ---------- */
.sbar{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.scount{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-bottom:26px}
.scount .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--jade);transition:width .3s}
.qlabel{font-size:14px;color:var(--muted);margin-bottom:16px}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.py{font-size:20px;color:var(--muted)}
.py-hidden{border:1.5px dashed var(--line);border-radius:8px;background:none;padding:4px 14px;color:var(--muted);cursor:pointer;font-size:14px}
.prompt-vi{font-size:24px;font-weight:600}
.sentence{font-family:var(--zh);font-size:28px;line-height:1.6}
.sentence .blank{display:inline-block;min-width:2.2em;border-bottom:2.5px solid var(--seal);margin:0 4px}
.trans{font-size:16px;color:var(--muted)}
.play{width:88px;height:88px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.play svg{width:34px;height:34px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px;width:100%}
.opt{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;min-height:58px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.zhopt{font-family:var(--zh);font-size:24px}
.opt.sent{font-family:var(--zh);font-size:19px}
.opt.ok{border-color:var(--jade);background:var(--jade-soft)}
.opt.bad{border-color:var(--seal);background:var(--seal-soft)}
.opt[disabled]{cursor:default}
.opts.one{grid-template-columns:1fr}
.typein{display:flex;gap:10px;width:100%;max-width:440px;margin-top:20px}
.typein input{flex:1;padding:13px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:19px;min-width:0}
.typein input:focus{border-color:var(--jade);outline:none}
.row-actions{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.chip{font-family:var(--zh);font-size:22px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip .kbd{font-size:11px}
.chip.used{visibility:hidden}
.answer-line{width:100%;max-width:560px;min-height:62px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding-bottom:8px;margin:8px 0 18px}
.fb{margin-top:26px;padding:22px 24px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.verdict{font-weight:700;font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.verdict.ok{color:var(--jade)}.verdict.bad{color:var(--seal)}
.fb-actions{display:flex;gap:18px;align-items:center;margin-top:22px;flex-wrap:wrap}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.grades.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px}
.grades.two .gbtn.g3 b{color:var(--jade)}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:58px;position:relative}
.gbtn b{font-size:16px}.gbtn span{font-size:13px;color:var(--muted)}
.gbtn .kbd{position:absolute;top:4px;right:6px;font-size:10px;line-height:16px;padding:0 4px}
.gbtn:hover{border-color:var(--muted)}
.gbtn.g1 b{color:var(--seal)}.gbtn.g4 b{color:var(--jade)}
.gbtn.sug{border-color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Chi tiết từ ---------- */
.word{display:flex;gap:22px;align-items:flex-start;text-align:left}
.word-main{flex:1;min-width:0}
.word.long{flex-direction:column;gap:14px}
.word-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.word-top .pyv{font-size:21px}
.word-mean{font-size:19px;font-weight:600;margin-top:6px}
.pos{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.exs{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.ex{display:flex;gap:10px;align-items:flex-start}
.ex .zhs{font-family:var(--zh);font-size:19px;line-height:1.5}
.ex .pys{font-size:14px;color:var(--muted)}
.ex .vis{font-size:15px}
.note{margin-top:14px;font-size:15px;padding:10px 14px;background:var(--surface2);border-radius:8px}
.emoji{font-size:26px}
.t1{color:var(--tone1)}.t2{color:var(--tone2)}.t3{color:var(--tone3)}.t4{color:var(--tone4)}.t5{color:var(--muted)}
.tone-demo span{font-weight:600;margin-right:4px}
.family{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.family summary{cursor:pointer;font-weight:600;font-size:15px;padding:2px 0}
.fgroup{margin-top:10px}
.fhead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fhead .zh{font-family:var(--kai);font-size:22px;line-height:1}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;text-align:left;max-width:100%}
button.fchip{cursor:pointer}button.fchip:hover{border-color:var(--jade)}
.fchip .fz{font-family:var(--zh);font-size:17px}
.fchip .fp{color:var(--muted)}
.fchip .fv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11em}
.fchip .lvtag{margin-left:0}
.fchip .fz,.fchip .lvtag{white-space:nowrap}
@media (max-width:760px){.fchip{padding:4px 8px;gap:5px}.fchip .fp{display:none}.fchip .fv{max-width:6.5em}.fchip .fz{font-size:16px}}

/* ---------- Danh sách ---------- */
.search{width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;margin:20px 0 14px}
.search:focus{border-color:var(--jade);outline:none}
.levels{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.lv{padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:none;cursor:pointer;font-size:14px}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv[disabled]{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:12px 18px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface2)}
.li .hz{font-family:var(--kai);font-size:28px;min-width:2.2em}
.li .meta .p{font-size:15px}
.li .meta .m{font-size:15px;color:var(--muted)}
.lvtag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);font-size:11px;color:var(--muted);vertical-align:middle}
.dhead{margin:0 0 10px}
.lvtag.on{border-color:var(--jade);color:var(--jade)}
.topic-card{display:flex;gap:16px;align-items:flex-start;text-align:left}
.topic-card .t{font-size:19px}
.tbar{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-right:4px}
.tbar i{display:block;height:100%;background:var(--jade)}
.tlist .titem{border-top:1px solid var(--line)}
.tlist .titem:first-child{border-top:0}
.tlist .titem .li{border-top:0}
.tex{display:flex;gap:10px;align-items:flex-start;padding:0 18px 14px 18px}
.tex .zhs{font-size:17px}
.tex .pys,.tex .vis{font-size:14px;color:var(--muted)}
.topic-line{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.more{margin-top:26px}.more>h2{margin-bottom:10px}
.morelist{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.mrow3,.mrowd>summary{display:flex;align-items:center;gap:12px;padding:12px 16px}
.mrow3+.mrow3,.mrow3+.mrowd,.mrowd+.mrowd,.mrowd+.mrow3{border-top:1px solid var(--line)}
.mrowd>summary{cursor:pointer;list-style:none}.mrowd>summary::-webkit-details-marker{display:none}
.mg{width:36px;height:36px;border-radius:12px;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-family:var(--kai);font-size:20px;flex:none}
.mrow3.warn .mg{background:var(--seal-soft);color:var(--seal)}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}.mt b{font-weight:700}.mt span{font-size:13px;color:var(--muted)}
.msm{padding:6px 14px;min-height:34px;font-size:14px;flex:none}
.chev{font-size:22px;color:var(--muted);transition:transform .2s}
.mrowd[open]>summary .chev{transform:rotate(90deg)}
.mbody{padding:0 16px 14px 64px}
.how-list ul{margin:0;padding-left:18px}.how-list li{margin:6px 0;font-size:15px}
.mbody .srow{padding:10px 0}
.brk{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 0}
.brk .petbadge{width:120px;height:120px}
.sbtxt{white-space:nowrap}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mbody{padding-left:16px}.hide-sm{display:none}.sbar{gap:10px}}
.lvrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.lvact{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn.armed{border-color:var(--seal);color:var(--seal)}
.petpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;width:100%}
.pp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface2);cursor:pointer}
.pp:hover{border-color:var(--jade)}
.pp[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);box-shadow:0 0 0 2px var(--jade) inset}
.ppimg{width:84px;height:84px;display:block}
.ppname{font-size:13px;font-weight:700;text-align:center;line-height:1.25}
.petname-in{width:180px;max-width:100%;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.lhint{margin:0 0 4px;padding-left:18px}.lhint li{margin:4px 0}
.hzg{border-top:1px solid var(--line);padding:8px 0}
.hzg summary{cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}
.hzgrid-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:3px;margin-top:8px}
.hc{aspect-ratio:1;border:0;border-radius:5px;font-family:var(--kai);font-size:20px;line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.hc:hover{outline:2px solid var(--ink);outline-offset:1px}
.hz0{background:var(--heat0);color:var(--muted)}.hz1{background:var(--heat1);color:var(--ink)}.hz2{background:var(--heat2);color:var(--ink)}.hz3{background:var(--heat3);color:var(--hzink)}.hz4{background:var(--heat4);color:var(--hzink)}
.legend .sw.hz0,.legend .sw.hz1,.legend .sw.hz2,.legend .sw.hz3,.legend .sw.hz4{color:transparent}
.sched .srow{padding:12px 0;border-top:1px solid var(--line)}
.sched .srow:first-of-type{border-top:0}
.sched .sctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 6px}
.sched select{padding:7px 10px}
.cap-line{margin-top:6px}
.dhead .link{font-size:inherit}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:16px}
.pager .muted{padding:0 6px}
.status{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.detail{padding:18px 18px 22px;border-top:1px solid var(--line);background:var(--surface2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* ---------- Thành ngữ ---------- */
.dmode{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:14px;background:var(--surface2)}
.dmode button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 16px;border-radius:999px;cursor:pointer}
.dmode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.li .hz.idz{font-size:22px;letter-spacing:.02em}
.lvtag.story{border-color:var(--seal);color:var(--seal)}
.idm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.idm-top .zh{font-family:var(--zh);font-size:30px;letter-spacing:.04em}
.idm-top .pyv{font-size:19px}
.idm-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:15px}
.idm-kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.idm-kv dd{margin:0;min-width:0}
.idm-story{margin-top:16px;padding:14px 16px;border-left:3px solid var(--seal);background:var(--surface);border-radius:0 8px 8px 0;font-size:15px;line-height:1.65}
.idm-story h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--seal)}
.idm-story .src{font-family:var(--zh);color:var(--muted);font-size:13px;margin-left:6px;text-transform:none;letter-spacing:0}
.flipans{text-align:left}
.acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acct img,.acct .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover}
.acct .av{display:grid;place-items:center;background:var(--jade-soft);color:var(--jade);font-weight:800;font-size:18px}
.acct .who{flex:1;min-width:0}.acct .who b{display:block}.acct .who span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.gbtn-g{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;min-height:46px}
.gbtn-g:hover{border-color:var(--jade)}.gbtn-g svg{width:20px;height:20px;flex:none}
.nav .sync{border:0;background:none;cursor:pointer;text-align:left;font:inherit;font-size:13px;color:var(--muted)}
.nav .sync:hover{color:var(--ink)}
.nav .sync img{width:22px;height:22px;border-radius:50%}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 22px;width:100%}
.keyg-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);margin-bottom:4px}
.keyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14px;border-top:1px dashed var(--line)}
.keyg .keyrow:first-of-type{border-top:0}
.keycap{min-width:58px;padding:4px 10px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:9px;background:var(--surface2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.keycap:hover{border-color:var(--jade)}
.keycap.wait{border-color:var(--seal);color:var(--seal);animation:keyblink 1s ease-in-out infinite}
@keyframes keyblink{50%{opacity:.55}}
.stabs{margin:14px 0 4px}.stabs button{padding:8px 20px;font-size:15px}
.idm-acts{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Ngữ pháp ---------- */
.g-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;margin-bottom:10px}
.g-card:hover{border-color:var(--muted)}
.g-card .t{font-weight:650;font-size:17px}
.g-card .s{color:var(--muted);font-size:15px;margin-top:2px}
.g-card .st{font-size:13px;margin-top:10px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.formula{font-family:var(--font);font-size:19px;padding:14px 18px;border-left:3px solid var(--seal);background:var(--surface);border-radius:0 8px 8px 0;margin:18px 0}
.prose p{margin:10px 0;max-width:40em}
.err{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.err div{padding:12px 14px;border-radius:8px;font-family:var(--font);font-size:18px}
.gsearch-hint{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.err .w{background:var(--seal-soft);text-decoration:line-through;text-decoration-color:var(--seal)}

/* ---------- Tiến độ ---------- */
.table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden}
.table th,.table td{padding:11px 16px;text-align:left;border-top:1px solid var(--line);font-size:15px}

.bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding:16px 16px 0;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:13px}

.stackbar i{display:block;height:100%;min-width:2px}
.stackbar i:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:10px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lrows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:76px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart .tg{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .ln{fill:none;stroke:var(--jade);stroke-width:2;stroke-linejoin:round}
.chart .pt circle{fill:var(--jade);stroke:var(--surface);stroke-width:2}
.chart .pt .hit{fill:transparent;stroke:none;cursor:default}
.chart .pt:hover circle:first-child{r:7}
.fbars{display:flex;gap:2px;align-items:stretch;height:150px;padding:12px 10px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fb1{flex:1;display:flex;flex-direction:column;min-width:0}
.fb1 .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.fb1 .col i{display:block;width:100%;background:var(--jade);min-height:2px}
.fb1 .col i:first-child{border-radius:3px 3px 0 0}
.fb1 .col i.t{background:var(--heat2);margin-bottom:2px}
.fb1 span{font-size:11px;color:var(--muted);white-space:nowrap;height:22px;padding-top:4px;overflow:visible}
.fb1:hover .col i{opacity:.8}
@media (max-width:760px){.lrow{grid-template-columns:62px minmax(0,1fr);}.lrow .num{grid-column:2;text-align:left;margin-top:-4px}.hhero .hn{font-size:34px}}

/* ---------- Cài đặt ---------- */
.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}

select{padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px}
textarea{width:100%;min-height:90px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}

/* ---------- Điện thoại ---------- */

}

/* ============ Giao diện "Vườn yên bình": bo tròn mềm, xanh lá dịu, cảnh đồi cỏ, thú cưng đồng hành ============ */

.toast{border-radius:999px;background:var(--jade);color:var(--on-accent)}

/* Góc thú cưng ở trang Hôm nay */
.nook{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px}
.scene{position:relative;min-height:250px;overflow:hidden}
.scene>svg.land{position:absolute;inset:0;width:100%;height:100%}

.bubble{position:absolute;left:12px;right:12px;top:12px;background:var(--surface);color:var(--ink);border-radius:16px;padding:9px 13px;font-size:14px;font-weight:600;box-shadow:var(--shadow);text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--surface);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.nook-body{padding:24px 26px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.nook-body .summary{margin-bottom:16px}
.petcard{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;font-size:14px}
.petcard .pname{font-family:var(--display);font-size:18px;font-weight:600}
.petcard .pstage{font-size:12px;color:var(--jade);border:1px solid var(--jade);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.xpbar{height:8px;border-radius:4px;background:var(--heat0);overflow:hidden}

.bowl{display:flex;align-items:center;gap:6px;color:var(--muted)}

.bowl i.on{background:var(--fur2)}
.pet-svg{width:100%;height:100%;overflow:visible}
.pet-svg .bodyg{transform-origin:60px 112px;animation:breathe 3.8s ease-in-out infinite}
.pet-svg .tail{transform-origin:84px 94px;animation:sway 3s ease-in-out infinite}

.pet-svg .zz{animation:floatz 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}

/* Nhạc nền */

.scene,.room{--dim:0;--evg:#4A9443;--evg2:#6DAE5A;--water:#8CC8D6;--water2:#5FA8BE;--rice1:#7DB653;--rice2:#93C765;--riceln:#E9F2C8}

.scene[data-season="summer"],.room[data-season="summer"]{--leaf:#2F8A3A;--leaf2:#4FA845;--hill1:#9ED27A;--hill2:#6CBC56;--hill3:#4A9E44;--flower:#E8473B;--flower2:#F9C74F;--stint:#FFF0A0;--stint-op:.06}
.scene[data-season="autumn"],.room[data-season="autumn"]{--leaf:#D5652B;--leaf2:#EBA23A;--hill1:#E6D18C;--hill2:#D1B762;--hill3:#B49743;--flower:#C9472B;--flower2:#F2B63A;--trunk:#6E4A30;--stint:#FFAE4F;--stint-op:.12}
.scene[data-season="winter"],.room[data-season="winter"]{--leaf:#4F7468;--leaf2:#6C8E82;--hill1:#EEF3F6;--hill2:#DCE5EB;--hill3:#C7D4DD;--flower:#FFFFFF;--flower2:#DDE7EE;--trunk:#5E5048;--stint:#D8E4EE;--stint-op:.22}
.scene[data-tod="day"][data-season="spring"],.room[data-tod="day"][data-season="spring"]{--sky1:#B9E1F2;--sky2:#FDE7EF;--sun:#FFE08A;--water:#A9DEDC;--water2:#7CC4C6}
.scene[data-tod="day"][data-season="summer"],.room[data-tod="day"][data-season="summer"]{--sky1:#5DB9EE;--sky2:#CFEFFC;--sun:#FFD23F;--water:#58C0DA;--water2:#2A98BA}
.scene[data-tod="day"][data-season="autumn"],.room[data-tod="day"][data-season="autumn"]{--sky1:#A9CFE0;--sky2:#F9E3B8;--sun:#F7B24C;--cloud:#FFF7EA;--water:#94B9BC;--water2:#6E979E}
.scene[data-tod="day"][data-season="winter"],.room[data-tod="day"][data-season="winter"]{--sky1:#B9C7D3;--sky2:#ECF1F5;--sun:#F1EFE6;--cloud:#F6F8FA;--water:#B4C4CF;--water2:#8EA3B1}
.scene[data-season="spring"]{--rice1:#A9D27C;--rice2:#8FC1D2;--riceln:#F1F7DA}
.scene[data-season="summer"]{--rice1:#5DAE3E;--rice2:#79C24E;--riceln:#D8EDB0}
.scene[data-tod="night"][data-season]{--stint-op:.05}
.scene[data-season="spring"]{--evg:#5FAE4E;--evg2:#86C56A}
.scene[data-season="summer"]{--evg:#2F8A3A;--evg2:#4FA845}
.scene[data-season="autumn"]{--evg:#5E8A3A;--evg2:#8AA34A}
.scene[data-season="winter"]{--evg:#4F7468;--evg2:#6C8E82}
.stint{fill:var(--stint,transparent);opacity:var(--stint-op,0);pointer-events:none}
.sdeco .flap{transform-box:fill-box;transform-origin:center;animation:flap .5s ease-in-out infinite alternate}
.sdeco .drift{animation:drift 7s ease-in-out infinite alternate}
.sdeco .sway{transform-box:fill-box;transform-origin:100% 0;animation:sway 5s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.25)}}
@keyframes drift{to{transform:translate(14px,-6px)}}
@keyframes sway{to{transform:rotate(-3deg)}}
.fx .firefly{width:4px;height:4px;border-radius:50%;background:#FFF3A0;box-shadow:0 0 6px 2px rgba(255,236,120,.7);animation-name:float!important}
@keyframes float{0%{transform:translate(0,180px);opacity:0}30%{opacity:1}100%{transform:translate(24px,40px);opacity:0}}
.scene[data-tod="dusk"] .landg,.room[data-tod="dusk"] .landg{filter:brightness(.93) sepia(.12)}
.scene[data-tod="night"] .landg,.room[data-tod="night"] .landg{filter:brightness(.6) saturate(.75)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;top:-12px;display:block;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.fx .petal{width:8px;height:6px;border-radius:60% 0 60% 0;background:#F7C6D3}
.fx .leafx{width:9px;height:6px;border-radius:0 70% 0 70%;background:#E39A45}
.fx .snow{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.15)}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.95}100%{transform:translate(-30px,270px) rotate(260deg);opacity:0}}
/* Phòng của bé */
.room{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);aspect-ratio:400/260;max-width:100%;background:var(--wall)}
.roomsvg{position:absolute;inset:0;width:100%;height:100%}
.placetabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;max-width:440px;gap:4px;padding:4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);margin-bottom:12px}
.placetabs button{border:0;background:none;padding:7px 8px;white-space:nowrap;font-size:14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.placetabs button[aria-selected="true"]{background:var(--jade);color:var(--on-accent)}
.room.locked .roomsvg{filter:blur(2px) saturate(.6) brightness(.95)}
.room.locked .roompet{opacity:.5}
.unlock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,86%);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}

.coin{width:18px;height:18px;flex:none;vertical-align:-3px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:center}
.sitem.own{background:var(--jade-soft);border-color:var(--jade)}
.sicon{width:64px;height:64px}
.sname{font-weight:700;font-size:14px}
.sbuy{padding:6px 14px;min-height:36px;font-size:14px}
.roomlink{display:flex;align-items:center;gap:8px;margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);cursor:pointer;text-align:left;font-size:14px}
.roomlink:hover{border-color:var(--jade)}
.roomlink span:nth-child(2){flex:1}
.donecoin{margin-top:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
.mini-pet{width:38px;height:38px;flex:none}
.scount{align-items:center}
.today-head .petbadge{width:64px;height:64px;flex:none}

  .nook{grid-template-columns:1fr}
  .scene{min-height:220px}
  .nook-body{padding:18px 18px 22px}
}

/* =====================================================================
   CHACHA — bố cục mới: thanh biểu tượng dọc, bề mặt kính mờ, chữ Fraunces + Quicksand
   ===================================================================== */
:root{--font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--display:"Lora","Be Vietnam Pro",Georgia,serif;--zh:"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;--kai:"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;--glyph:"Ma Shan Zheng","Noto Serif SC",serif}
body{background:var(--bgimg),var(--bg);background-attachment:fixed;font-weight:400}
b,strong{font-weight:700}
h1,h2,h3{font-family:var(--display)}
h1{font-size:34px;font-weight:600;letter-spacing:-.02em}
h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
h3{font-weight:600}
.eyebrow{color:var(--jade);letter-spacing:.14em;font-weight:700}
.panel,.list,.g-card,details.how,.fb,.wotd,.morelist,.stat,.table,.heat,.bars,.fbars,.mirror,.sitem,.unlock{background:var(--glass);border:1px solid var(--glass-bd);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1)}
.panel,.list,.g-card,.fb,.wotd,.morelist{border-radius:24px}
.btn{background:var(--cta);color:var(--cta-ink);border:0;font-weight:700;box-shadow:0 12px 26px -14px var(--jade),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover{opacity:1;filter:brightness(1.05)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none;filter:none}
.btn.ghost:hover{border-color:var(--jade)}
.btn.armed{border-color:var(--seal);color:var(--seal)}
.seg button[aria-pressed="true"],.lv[aria-pressed="true"],.placetabs button[aria-selected="true"],.dmode button[aria-pressed="true"]{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.toast{background:var(--ink);color:var(--surface);font-weight:600}
.opt,.gbtn,.chip,.typein input,.search{background:var(--surface)}
.opt{border-radius:18px}
.opt.ok{background:var(--jade-soft);border-color:var(--jade)}
.track{background:var(--heat0)}.track i{background:var(--cta)}
.xpbar i{background:var(--cta)}
.verdict.ok{color:var(--jade)}
.cell{background:var(--surface)}
.nav .glyph{font-family:var(--glyph)}
.brand .cup svg{width:48px;height:48px;display:block}

.mbtn{background:var(--glass);border-color:var(--glass-bd);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mbtn.on{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.mpanel{background:var(--glass);border-color:var(--glass-bd);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.mmode[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade)}
@media (min-width:761px){
  .app{grid-template-columns:100px minmax(0,1fr)}
  .nav{width:100px;padding:22px 12px 18px;align-items:center;gap:6px;background:var(--glass);border-right:1px solid var(--glass-bd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .brand{flex-direction:column;gap:3px;margin:0 0 20px}
  .nav button{flex-direction:column;justify-content:center;gap:4px;width:76px;padding:10px 4px 9px;border-radius:20px;font-size:12px;font-weight:700;text-align:center;line-height:1.2}
  .nav .glyph{font-size:26px;width:auto;line-height:1.05}
  .nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .nav button[aria-current="page"] .glyph{color:var(--jade)}

  main{margin:0 auto;max-width:940px;padding:40px 44px 80px}

/* ---- Trang Hôm nay ---- */
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 20px;flex-wrap:wrap;margin-bottom:22px}

.mcard,.wcard{background:var(--glass);border:1px solid var(--glass-bd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow)}
.mc-top{display:flex;align-items:center;gap:14px}

.mc-t{min-width:0}.mc-t b{display:block;font-family:var(--display);font-size:17px;font-weight:600}

.qtile:hover{border-color:var(--jade);transform:translateY(-1px)}
.qtile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--glyph);font-size:23px;color:#2A1E3A;flex:none}
.qtile .qt{min-width:0}
.qtile b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtile .qt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1180px){.qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.qcard{padding:16px}.qsearch{max-width:none}.qtile{padding:10px}.qtile .ic{width:36px;height:36px;font-size:21px}}
@media (prefers-reduced-motion:reduce){.qtile{transition:none}}

/* ---- Học ngay: dải dưới cảnh nền, không che phong cảnh ---- */
.hhero .scene{min-height:400px}
.hhero .petwrap{left:50%;right:auto;transform:translateX(-50%);bottom:3%;width:min(200px,34%)}
.hhero .bubble{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:min(420px,80%)}
.hhero .bubble::after{left:50%;right:auto}
.hpanel{position:static;width:auto;border-radius:0;border:0;border-top:1px solid var(--glass-bd);box-shadow:none;background:var(--hp-bg);-webkit-backdrop-filter:none;backdrop-filter:none;padding:18px 22px;gap:20px}
.hp-txt{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:center}
.hp-txt>*{grid-column:1}
.hp-txt>.btn,.hp-txt>.hbtns{grid-column:2;grid-row:1/4;align-self:center}
.hp-txt>.cap-line{grid-column:1/-1}
.hp-txt .hsub{margin-bottom:0}
.htitle{font-size:26px}
.hring{width:104px;height:104px}
/* ---- Lộ trình ---- */
.road{background:var(--glass);border:1px solid var(--glass-bd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:26px;padding:18px 22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hmain>.road{flex:1}
.rd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap}
.rd-t{min-width:0}.rd-t h3{font-size:20px}.rd-t span{font-size:13.5px;color:var(--muted)}
.rd-goal{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.rd-goal span{font-size:12px;font-weight:700;color:var(--muted);padding:0 6px 0 8px}
.rd-goal button{border:0;background:none;border-radius:999px;min-width:30px;height:28px;padding:0 8px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.rd-goal button[aria-pressed="true"]{background:var(--cta);color:var(--cta-ink)}
.rd-path{display:flex;align-items:center;padding:4px 4px 22px;flex:1}
.rnode{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--glyph);font-size:25px;color:#fff}
.rnode .zh{font-family:var(--glyph)}
.rnode small{position:absolute;top:100%;margin-top:7px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.rnode.d{background:#7FC6A0;box-shadow:0 5px 0 #5AA27E}
.rnode.c{width:64px;height:64px;background:var(--cta);color:var(--cta-ink);box-shadow:0 5px 0 rgba(0,0,0,.12),0 0 0 7px var(--jade-soft)}
.rnode.c small{color:var(--jade)}
.rnode.l{background:var(--heat0);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.rnode.g{font-size:24px;font-family:var(--font)}
.rnode.g.l{opacity:.9}
.rlink{flex:1;min-width:10px;height:6px;margin:0 4px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 9px,transparent 9px 16px)}
.rlink.d{background:#7FC6A0}
.rd-bar{display:flex;gap:4px;height:9px}
.rd-bar i{display:block;border-radius:5px;background:var(--heat0);overflow:hidden}
.rd-bar b{display:block;height:100%;background:var(--cta);border-radius:5px}
.rd-legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--muted)}
.rd-legend b{color:var(--ink)}
.rd-foot p{margin-top:8px;font-size:14px}
.rd-foot p b{color:var(--jade);font-family:var(--display);font-size:17px}
@media (max-width:760px){
  .hhero .scene{min-height:280px}
  .hhero .petwrap{width:150px}
  .hhero .bubble{max-width:calc(100% - 24px)}
  .hpanel{padding:16px 18px}
  .hp-txt{grid-template-columns:1fr}
  .hp-txt>.btn,.hp-txt>.hbtns{grid-column:1;grid-row:auto;margin-top:12px;justify-self:start}
  .htitle{font-size:22px}
  .hring{width:84px;height:84px}
  .road{padding:16px}
  .rnode{width:44px;height:44px;font-size:20px}.rnode.c{width:50px;height:50px}
  .rnode small{font-size:10.5px}
}

/* Tuần này: biểu đồ cột */
.wcard .wdays{flex:1;min-height:110px;align-items:stretch;gap:8px;margin:14px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0}
.wd em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);height:14px;line-height:14px}
.wd .wb{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:40px}
.wd .wb i{display:block;width:72%;max-width:30px;aspect-ratio:auto;border-radius:9px 9px 5px 5px;background:var(--heat2);box-shadow:none}
.wd .wb i.z{background:var(--heat0)}
.wd.today .wb i{background:var(--cta);box-shadow:none}
.wd.today em{color:var(--jade)}

.road{min-width:0;overflow:hidden}
.rd-path{min-width:0}
@media (max-width:760px){
  .rd-path .far{display:none}
  .rlink{min-width:14px}
  .hhero .scene-chip{top:auto;bottom:10px}
}

/* Noto Serif SC: nét dày hơn chút cho dễ đọc */
.zhs,.sentence,.opt.zhopt,.opt.sent,.chip,.tex .zhs,.wotd-ex .zhs,.ex .zhs,.err div{font-weight:500}
.cell .ch{font-weight:500}

/* ---- Chăm sóc thú cưng ---- */
.needs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:4px 0 2px}
.need{display:grid;grid-template-columns:20px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:7px;align-items:center;font-size:12.5px}
.need .ni{grid-row:1/3;width:20px;height:20px;color:var(--nc)}
.need .ni svg{width:20px;height:20px;display:block}
.need .nl{font-weight:600;color:var(--muted)}
.need .nv{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.need .nb{grid-column:2/4;height:7px;border-radius:4px;background:var(--heat0);overflow:hidden;margin-top:3px}
.need .nb i{display:block;height:100%;border-radius:4px;background:var(--nc);transition:width .6s}
.need.low .nl,.need.low .nv{color:var(--seal)}
.need.low .ni{animation:needpulse 1.4s ease-in-out infinite}
@keyframes needpulse{50%{transform:scale(1.18)}}
.petacts{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pact{gap:5px;padding:10px 4px 9px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--pc);font-size:12.5px;transition:transform .15s,border-color .15s,box-shadow .15s}
.pact:hover{border-color:var(--pc);transform:translateY(-2px);box-shadow:0 8px 18px -12px var(--pc)}
.pact:active{transform:translateY(0)}
.pact .pi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc)}
.pact .pi svg{width:24px;height:24px}
.pact .pl{color:var(--ink);font-weight:600;white-space:nowrap}
.pact em{top:5px;right:6px;font-size:10.5px;color:var(--pc);background:var(--surface);border-radius:999px;padding:0 4px}
.pact.dim{opacity:.5}
.pbub{position:absolute;bottom:18%;width:var(--sz);height:var(--sz);border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 25%,rgba(180,225,250,.55) 30% 100%);border:1px solid rgba(255,255,255,.9);pointer-events:none;animation:bubup 1.8s ease-out forwards}
@keyframes bubup{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.15)}}
.pspark{position:absolute;bottom:35%;font-size:var(--sz);color:#FFC94D;pointer-events:none;animation:sparkup 1.5s ease-out forwards;text-shadow:0 0 6px rgba(255,220,120,.8)}
@keyframes sparkup{0%{opacity:0;transform:translateY(10px) scale(.5) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.1) rotate(90deg)}}
.hhero .petwrap.walking{animation:petwalk 3s ease-in-out}
@keyframes petwalk{0%{transform:translateX(-50%)}30%{transform:translateX(-150%)}35%{transform:translateX(-150%) scaleX(-1)}70%{transform:translateX(50%) scaleX(-1)}75%{transform:translateX(50%)}100%{transform:translateX(-50%)}}
.petwrap.dirty::after{content:"";position:absolute;inset:30% 22% 8%;pointer-events:none;background:radial-gradient(circle at 25% 60%,rgba(120,86,50,.55) 0 5%,transparent 6%),radial-gradient(circle at 70% 40%,rgba(120,86,50,.5) 0 4%,transparent 5%),radial-gradient(circle at 55% 78%,rgba(120,86,50,.5) 0 6%,transparent 7%),radial-gradient(circle at 35% 30%,rgba(120,86,50,.45) 0 3%,transparent 4%)}
.hhero .scene:has(.petwrap.asleep)::after{content:"";position:absolute;inset:0;background:rgba(25,20,60,.28);pointer-events:none;z-index:1}
.hhero .scene:has(.petwrap.asleep) .petwrap,.hhero .scene:has(.petwrap.asleep) .bubble,.hhero .scene:has(.petwrap.asleep) .scene-chip{z-index:2}
@media (max-width:760px){.needs{gap:8px 10px}.pact .pi{width:34px;height:34px}.pact .pi svg{width:21px;height:21px}.pact{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){.pbub,.pspark{display:none}.hhero .petwrap.walking{animation:none}.need.low .ni{animation:none}}

.need .ni{grid-column:1;grid-row:1/3}.need .nl{grid-column:2;grid-row:1}.need .nv{grid-column:3;grid-row:1}.need .nb{grid-column:2/4;grid-row:2}
.petwrap.dirty::after{inset:38% 24% 6%;background:radial-gradient(circle at 22% 55%,rgba(110,76,42,.75) 0 7%,transparent 8%),radial-gradient(circle at 74% 38%,rgba(110,76,42,.7) 0 6%,transparent 7%),radial-gradient(circle at 56% 80%,rgba(110,76,42,.7) 0 8%,transparent 9%),radial-gradient(circle at 38% 28%,rgba(110,76,42,.6) 0 5%,transparent 6%),radial-gradient(circle at 82% 70%,rgba(110,76,42,.6) 0 5%,transparent 6%)}

/* Tuần này gọn lại + Sắp ôn */
.wcard{justify-content:space-between;gap:14px}
.wcard .wdays{flex:none;height:92px;min-height:0;margin:2px 0 0}
.wcard .wgoals{margin-bottom:0}

.fc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}

.fc{display:flex;flex-direction:column;align-items:center;gap:4px}

.fc.hi b{box-shadow:inset 0 0 0 1.5px var(--jade)}
.fc span{font-size:11px;font-weight:700;color:var(--muted)}

/* Sắp ôn: que-chấm */
.fcast{background:var(--surface2);border-radius:16px;padding:12px 12px 10px}
.fc-h{margin-bottom:4px}
.fc-sum{font-size:12.5px;color:var(--muted)}.fc-sum b{font-family:var(--display);font-size:15px;color:var(--ink)}
.fc-row{gap:2px;align-items:end}
.fc{gap:3px}
.fc em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink);height:15px;line-height:15px;font-variant-numeric:tabular-nums}
.fc .fs{height:34px;width:100%;display:flex;justify-content:center;align-items:flex-end;position:relative}
.fc .fs::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;border-radius:1px;background:var(--line)}
.fc .fs i{position:relative;width:3px;border-radius:2px;background:linear-gradient(to top,transparent,var(--ring2));min-height:0}
.fc .fs i::before{content:"";position:absolute;left:50%;top:-5px;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);background:var(--cta);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring2) 22%,transparent)}
.fc.z .fs i::before{width:6px;height:6px;top:-4px;background:var(--line);box-shadow:none}
.fc.hi .fs i::before{width:14px;height:14px;top:-7px}
.fc.hi em{color:var(--jade)}
.fc span{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.fc.z span{opacity:.75}

.wd .wb{padding-top:17px}
.wd .wb i{position:relative}
.wd .wb i em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);line-height:1;height:auto}
.wd.today .wb i em{color:var(--jade)}
.fc .fs{height:52px;padding-top:24px;box-sizing:border-box}
.fc .fs i em{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:9px;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink);line-height:1;height:auto}
.fc.hi .fs i em{margin-bottom:11px;color:var(--jade)}

.wd .wb i.z,.wg-bar,.need .nb,.xpbar,.rd-bar i{background:color-mix(in srgb,var(--ink) 9%,transparent)}

.wd .wb i em,.fc .fs i em{white-space:nowrap;letter-spacing:-.02em}
.wstats b{white-space:nowrap}
</style>

   120 mục có trong HSK dùng lại id từ HSK (o.w); 80 mục ngoài HSK được tạo thành từ ngoài HSK với id cố định o.x (h0-1001…h0-1080, ghi sẵn trong idioms.js).

(function(){var I=window.HSK_IDIOMS||[],X=window.HSK_EXTRA=window.HSK_EXTRA||[],T=window.HSK_TOPICS=window.HSK_TOPICS||[];
if(!I.length||T.some(function(t){return t.id==="t-thanhngu"}))return;
I.forEach(function(o){if(o.x&&!X.some(function(w){return w.id===o.x}))X.push({id:o.x,lv:0,n:+o.x.slice(3),hz:o.hz,py:o.py,hv:o.hv,pos:"thành ngữ",vi:o.vi,ex:o.ex,note:(o.lit?"Nghĩa đen: "+o.lit+". ":"")+(o.vn?"Tiếng Việt: "+o.vn+". ":"")+(o.use||"")});});
var rank=function(o){return !o.lv?2:o.lv<7?1:3},ord=function(a,b){return rank(a)-rank(b)||(a.lv||0)-(b.lv||0)};
var item=function(o){var e=o.ex[1]||o.ex[0];return {id:o.w||o.x,ex:{zh:e.zh,py:e.py,vi:e.vi}}};
var desc=[[1,"+","Điển tích · nghĩa khen"],[1,"-","Điển tích · nghĩa chê"],[1,"0","Điển tích · trung tính"],[0,"+","Khen ngợi, chúc tụng"],[0,"-","Phê phán, nhắc nhở"],[0,"0","Miêu tả thường ngày"]];

/* =====================================================================
   FSRS-5 — thuật toán lặp lại ngắt quãng (tham số mặc định)
   ===================================================================== */
const FW = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

const initD = g => clampD(FW[4] - Math.exp(FW[5] * (g - 1)) + 1);
const retr = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
/* Mức ghi nhớ mong muốn (desired retention) chọn trong Cài đặt; chỉ áp dụng cho lần chấm tiếp theo, không xếp lại lịch cũ */
const retention = () => { const r = Number(S && S.settings && S.settings.retention); return r >= 0.7 && r <= 0.97 ? r : RETENTION; };
const intervalDays = s => Math.min(3650, Math.max(1, Math.round(s / FACTOR * (Math.pow(retention(), 1 / DECAY) - 1))));
function fsrsNext(c, g, elapsed) {
  const R = retr(Math.max(0, elapsed), c.s);
  let d = c.d + (-FW[6] * (g - 3)) * (10 - c.d) / 9;
  d = clampD(FW[7] * initD(4) + (1 - FW[7]) * d);
  let s;
  if (elapsed < 1) s = c.s * Math.exp(FW[17] * (g - 3 + FW[18]));
  else if (g === 1) s = Math.min(c.s, FW[11] * Math.pow(c.d, -FW[12]) * (Math.pow(c.s + 1, FW[13]) - 1) * Math.exp(FW[14] * (1 - R)));

  return { s: Math.max(0.1, s), d };
}

function migrateTopicCards() {
  for (const id of Object.keys(S.cards)) {
    if (!/^h0-/.test(id)) continue;
    const k = Object.keys(TITEM).find(x => TITEM[x].o.id === id);

let LAST_PUSH = 0;

function buildDoc(name) {

}
function mergeRemote(name, data) {

    if (rr > lr) { S.resetAt = rr; for (const id in S.cards) if ((S.cards[id].upd || 0) <= rr) delete S.cards[id]; S.log = {}; changed = true; }
    if (rr < lr) push = true;

      }

      else if (name === "meta" || Object.keys(S.cards).some(id => docFor(id) === name)) dirty.add(name);

/* 4 mức chấm theo FSRS/Anki: 1 Lại (quên), 2 Khó, 3 Được, 4 Dễ */
const GRADES = [[1, "Lại"], [2, "Khó"], [3, "Được"], [4, "Dễ"]];
function gradeState(id, g, now = Date.now()) {
  const c = S.cards[id];
  const st = c ? fsrsNext(c, g, (now - c.last) / DAY) : { s:FW[g - 1], d:initD(g) };
  const s = Math.round(st.s * 1000) / 1000, d = Math.round(st.d * 1000) / 1000;
  return { s, d, days:easyShift(intervalDays(s), now) };
}
/* Ngày học nhẹ (Easy Days, như FSRS Helper): nếu ngày đến hạn rơi vào ngày nhẹ thì dời sang ngày thường gần nhất trong khoảng ±10% khoảng ôn (ít nhất ±1 ngày, chỉ khi khoảng ôn ≥ 3 ngày). Ưu tiên dời sớm hơn khi hai phía bằng nhau */
const easySet = () => new Set((S.settings.easyDays || []).map(Number));
const isEasyDay = (t = Date.now()) => easySet().has(new Date(dayStart(t) + 6 * 3600e3).getDay());
function easyShift(days, now = Date.now()) {
  const E = easySet(); if (!E.size || E.size >= 7 || days < 3) return days;
  const wd = n => new Date(dayStart(now) + n * DAY + 6 * 3600e3).getDay();
  if (!E.has(wd(days))) return days;
  const delta = Math.max(1, Math.round(days * 0.1));
  for (let k = 1; k <= delta; k++) { if (days - k >= 1 && !E.has(wd(days - k))) return days - k; if (!E.has(wd(days + k))) return days + k; }
  return days;
}
function fmtIvl(n) { return n < 30 ? n + " ngày" : n < 365 ? (Math.round(n / 3) / 10).toLocaleString("vi-VN") + " tháng" : (Math.round(n / 36.5) / 10).toLocaleString("vi-VN") + " năm"; }
function applyGrade(id, g) {
  const now = Date.now();
  let c = S.cards[id], isNew = false;
  const st = gradeState(id, g, now);
  if (!c) { c = { reps:0, lapses:0, intro:dayKey(now) }; isNew = true; }

const svgLantern = (x, y, c, r = 5) => `<line x1="${x}" y1="${y - r - 4}" x2="${x}" y2="${y - r}" stroke="#5A3A22" stroke-width=".8"/><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.2}" fill="${c}"/><rect x="${x - r * .45}" y="${y - r * 1.3}" width="${r * .9}" height="2" fill="#7A4A1E"/><rect x="${x - r * .45}" y="${y + r * 1.1}" width="${r * .9}" height="2" fill="#7A4A1E"/><line x1="${x}" y1="${y + r * 1.3}" x2="${x}" y2="${y + r * 1.3 + 5}" stroke="${c}" stroke-width="1"/>`;

/* Chi tiết nhỏ theo mùa — dùng chung cho mọi cảnh. Xuân: cành đào, chim én, bướm. Hạ: cành phượng, chuồn chuồn, sen (cảnh có nước).
   Thu: cành lá đỏ, đàn nhạn bay, đèn ông sao, lá rụng trên đất. Đông: cành khô phủ tuyết, sương mù, tuyết phủ mặt đất */
const WATER_BG = new Set(["hoguom", "hoian", "mekong"]);
function seasonDeco(season, tod, bg) {
  const branch = (twig) => `<g class="sway"><path d="M372 84 Q330 92 300 108 Q282 118 268 116" stroke="var(--trunk)" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M330 94 Q318 78 304 74 M304 106 Q296 122 284 128 M346 88 Q350 104 340 118" stroke="var(--trunk)" stroke-width="2.4" fill="none" stroke-linecap="round"/>${twig}</g>`;
  const pts = [[268, 116], [282, 112], [296, 104], [304, 74], [312, 82], [284, 128], [292, 120], [340, 118], [344, 104], [324, 96], [356, 90], [316, 100]];
  const bird = (x, y, k = 1) => `<path d="M${x - 6 * k} ${y - 2 * k} Q${x - 3 * k} ${y - 4 * k} ${x} ${y} Q${x + 3 * k} ${y - 4 * k} ${x + 6 * k} ${y - 2 * k}" stroke="#2E3440" stroke-width="${1.4 * k}" fill="none" stroke-linecap="round"/>`;
  const fly = (x, y, c1, c2) => `<g class="drift"><g transform="translate(${x} ${y})"><g class="flap"><ellipse cx="-3.4" cy="-1" rx="3.6" ry="2.6" fill="${c1}"/><ellipse cx="3.4" cy="-1" rx="3.6" ry="2.6" fill="${c1}"/><ellipse cx="-2.6" cy="2" rx="2.4" ry="1.8" fill="${c2}"/><ellipse cx="2.6" cy="2" rx="2.4" ry="1.8" fill="${c2}"/></g><rect x="-.5" y="-3" width="1" height="6" rx=".5" fill="#3A2E28"/></g></g>`;
  const dfly = (x, y) => `<g class="drift"><g transform="translate(${x} ${y}) rotate(-8)"><rect x="-8" y="-.8" width="16" height="1.6" rx=".8" fill="#2C6E8F"/><g class="flap"><ellipse cx="-2" cy="-3" rx="2" ry="4.6" fill="#CFEAF5" opacity=".85" transform="rotate(-30)"/><ellipse cx="2" cy="-3" rx="2" ry="4.6" fill="#CFEAF5" opacity=".85" transform="rotate(30)"/></g></g></g>`;
  const ground = (fn) => [[18, 240], [46, 246], [74, 238], [292, 242], [318, 247], [346, 240]].map(([x, y], i) => fn(x, y, i)).join("");
  if (season === "spring") return `<g class="sdeco">
    ${branch(pts.map(([x, y], i) => `<g transform="translate(${x} ${y})">${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-2.6" rx="2" ry="2.8" fill="${i % 3 ? "#F7B8CC" : "#F49AB8"}" transform="rotate(${a})"/>`).join("")}<circle r="1.1" fill="#D1496F"/></g>`).join(""))}
    ${bird(120, 96)}${bird(136, 88, .8)}${bird(232, 100, .9)}
    ${fly(52, 196, "#F7D25C", "#F49AB8")}${fly(318, 206, "#FFFFFF", "#F7B8CC")}
    ${ground((x, y, i) => `<circle cx="${x}" cy="${y}" r="2.2" fill="${i % 2 ? "#FFFFFF" : "#F49AB8"}"/><circle cx="${x + 4}" cy="${y + 2}" r="1.6" fill="#F7D25C"/>`)}</g>`;
  if (season === "summer") return `<g class="sdeco">

/* =====================================================================
   NHẠC NỀN KHÔNG LỜI — tạo trực tiếp bằng Web Audio (không tải file ngoài), phát ngẫu nhiên nên không lặp lại.
   3 chế độ: piano + mưa nhẹ · cổ tranh 21 dây (bản cổ phong tự soạn) + suối · ambient chuông gió. Trình duyệt chỉ cho phát sau khi người dùng bấm.

const MUSIC_MODES = {
  piano:{ name:"Piano mưa", desc:"Piano chậm, tiếng mưa nhẹ" },
  zheng:{ name:"Cổ tranh 21 dây", desc:"Bản cổ phong chậm, tiếng suối chảy" },
  ambient:{ name:"Ambient tĩnh", desc:"Hợp âm trôi chậm, chuông gió xa" },
  lofi:{ name:"Lofi đêm", desc:"Nhịp lofi chậm, Rhodes ấm, đĩa than lách tách" }

const MZ = { ctx:null, master:null, dry:null, wet:null, timer:null, nodes:[], next:0, step:0, mode:null, kscache:{} };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function mzInit() {
  if (MZ.ctx) return true;

  return true;
}

function mzVinyl() {
  const ctx = MZ.ctx, sr = ctx.sampleRate, len = sr * 4, b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .018;
  for (let k = 0; k < 70; k++) { const at = Math.floor(Math.random() * (len - 200)), amp = .25 + Math.random() * .6, w = 8 + Math.floor(Math.random() * 40);
    for (let j = 0; j < w; j++) d[at + j] += (Math.random() * 2 - 1) * amp * Math.exp(-j / (w / 4)); }

  else { f1.type = "bandpass"; f1.frequency.value = 700; f1.Q.value = .7; f2.type = "lowpass"; f2.frequency.value = 2600; g.gain.value = .045;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .13; lg.gain.value = 260; lfo.connect(lg); lg.connect(f1.frequency); lfo.start(); MZ.nodes.push(lfo); }

  const ctx = MZ.ctx, f = mtof(m), g = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(v * .35, t + .4); g.gain.exponentialRampToValueAtTime(.0005, t + dur);

/* Cổ tranh 21 dây, lên dây chuẩn Rê ngũ cung (D E F# A B), từ D2 đến D6.

function roadCard() {

/* Tìm ngữ pháp: chữ Hán (khớp nguyên văn), tiếng Việt có/không dấu, pinyin không dấu */
const G_INDEX = new Map();
function gIndex(o) {
  let x = G_INDEX.get(o.id);
  if (x) return x;
  const plain = s => String(s || "").replace(/<[^>]+>/g, " ");
  const head = [o.num, o.cn, o.title, o.short, o.formula].map(plain).join(" ");
  const body = [...(o.explain || []), ...(o.examples || []).flatMap(e => [e.zh, e.py, e.vi]), ...(o.items || []).flatMap(t => [t.zh, t.a, t.vi]), ...(o.errors || []).flatMap(e => [e.w, e.r, e.why])].map(plain).join(" ");
  const py = [...(o.examples || []).map(e => e.py), ...(head.match(/\([^)]*\)/g) || [])].join(" ");
  x = { head, body, sHead: strip(head), sBody: strip(body), pAll: normPy(py) };
  G_INDEX.set(o.id, x);
  return x;
}
function grammarSearch(q) {
  const raw = q.trim(), sq = strip(raw);
  /* Có chữ Hán: mỗi cụm chữ Hán là một điều kiện (虽然 但是). Không có: cả cụm tiếng Việt/pinyin là một điều kiện ("bị động") */
  const terms = /[\u3400-\u9fff]/.test(raw) ? raw.split(/[\s…\.、,，\/]+/).filter(Boolean) : [raw.replace(/\s+/g, " ")];
  const out = [];
  for (const o of [...GRAMMAR, ...COMPARE]) {
    const x = gIndex(o);
    let score = 0, ok = true;
    for (const t of terms) {
      const st = strip(t), pt = normPy(t), isCjk = /[\u3400-\u9fff]/.test(t);
      if (isCjk ? x.head.includes(t) : x.sHead.includes(st)) score += 10;
      else if (isCjk ? x.body.includes(t) : x.sBody.includes(st)) score += 2;
      else if (!isCjk && pt.length >= 2 && x.pAll.includes(pt)) score += 1;
      else { ok = false; break; }
    }
    if (!ok) continue;
    if (terms.length > 1 && (x.head.includes(raw) || x.sHead.includes(sq))) score += 15;
    if (o.num && strip(o.num) === sq) score += 50;
    out.push([score, o]);
  }
  return out.sort((a, b) => b[0] - a[0] || (a[1].lv || 99) - (b[1].lv || 99)).map(r => r[1]);
}

const DICT_PAGE = 50;
const lvName = lv => Number(lv) === 0 ? "Ngoài HSK" : "HSK " + (Number(lv) === 7 ? "7–9" : lv);
/* Chuẩn hóa sẵn các trường tìm kiếm một lần, tránh tính lại cho 11.000 từ mỗi lần gõ */
let DICT_IDX = null;
function dictIndex() {
  if (!DICT_IDX) DICT_IDX = WORDS.map(w => ({ w, py:normPy(w.py), hv:strip(w.hv), vi:strip(w.vi) }));
  return DICT_IDX;

/* Điểm khớp: càng nhỏ càng lên đầu; -1 là không khớp */
function dictScore(x, qq, qs, qp) {
  if (!qq) return 0;
  const w = x.w;
  if (w.hz === qq) return 0;
  if (w.hz.startsWith(qq)) return 1;
  if (w.hz.includes(qq)) return 2;
  if (qp && x.py === qp) return 3;
  if (qs && (x.hv === qs || x.vi.split(/[,;，；]\s*/).some(s => s.trim() === qs))) return 4;
  if (qp && x.py.startsWith(qp)) return 5;
  if (qs && wordHit(x.hv, qs)) return 6;
  if (qp && qp.length >= 4 && x.py.includes(qp)) return 7;
  if (qs && wordHit(x.vi, qs)) return 8;
  return -1;
}

  const tpRows = TOPICS.map(t => { const ks = topicKeys(t), m = memOf(ks), due = topicDue(t).length;

document.addEventListener("keydown", e => {
  /* đang chờ gán phím trong Cài đặt */
  if (KEYCAP && VIEW === "settings") {
    if (["Shift", "Control", "Alt", "Meta", "CapsLock", "Tab"].includes(e.key)) return;

  }
  const typing0 = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (kIs("undo", e) && !typing0 && UNDO.length && (VIEW === "session" || VIEW === "done")) { e.preventDefault(); undo(); return; }
  const nk = kIs("next", e) || kIs("next2", e);
  if (VIEW === "session" && SES && SES.brk) { if (nk) { e.preventDefault(); resumeChunk(); } else if (kIs("exit", e)) exitSession(); return; }
  if (VIEW !== "session" || !SES || !SES.cur) return;
  const c = SES.cur, k = e.key, typing = typing0;
  if (kIs("exit", e)) { exitSession(); return; }
  if (c.m === "intro" && kIs("known", e) && !typing) { markKnown(); return; }
  if (!c.answered && c.m !== "intro" && kIs("forgot", e) && !typing && document.querySelector(".nudge")) { forceWrong(); return; }

    if (!c.revealed) { if (nk) { e.preventDefault(); flipReveal(); } else if (kIs("pinyin", e)) { c.hint = true; renderSessionReveal(); } return; }

    return;
  }
  if (c.answered) {
    const canGrade = !typing && c.correct && !c.practice;
    if (S.settings.grading === "passfail" && canGrade && (kIs("pfForget", e) || kIs("pfRemember", e))) cont(kIs("pfForget", e) ? 1 : 3);

    return;
  }

});
